gnn:
  hidden_dim: 64
  num_layers: 3
  conv_type: gine

ppo:
  lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  epochs_per_update: 4
  minibatch_size: 8
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5

training:
  total_updates: 2000
  episode_length: 100
  graphs_per_rollout: 8
  synthetic_pool_size: 200
  node_count_range: [10, 40]
  seeds: [0, 1, 2, 3, 4]